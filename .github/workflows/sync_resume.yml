# Workflow Name displayed in the GitHub Actions tab
name: Sync Resume from Overleaf

on:
  # Manual trigger: runs in "Actions" tab > "Run workflow" button
  workflow_dispatch:

  # Automatic trigger: runs on the 1st of every month at 8am Singapore time
  schedule:
    - cron: '0 0 1 * *'

jobs:
  sync-resume:
    # Settings of the Github container
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Step 1: Assess the github repo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Python for document processing
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Download `resume.tex` from Overleaf (repo secret)
      - name: Download resume from Overleaf
        env:
          OVERLEAF_URL: ${{ secrets.OVERLEAF_RESUME_URL }}
        run: |
          git clone --depth 1 --branch v2 https://github.com/Sbrjt/overleaf-resume-syncer /tmp/syncer
          pip install -q -r /tmp/syncer/requirements.txt pymupdf
          python /tmp/syncer/download_from_overleaf.py "$OVERLEAF_URL"

      # Step 4: Delete the downloaded PDF and remove the phone number from the LaTeX source
      - name: Remove phone number from LaTeX source
        run: |
          rm -f resume.pdf
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("resume.tex")
          src = path.read_text(encoding="utf-8")

          # Remove the phone link and its preceding header separator.
          pattern = r'\\quad\s*\|\s*\\quad\s*\\href\{tel:[^}]*\}\{[^}]*\}\s*'
          src = re.sub(pattern, "", src)

          path.write_text(src, encoding="utf-8")
          PY

      # Step 5: Set up Tectonic and cache its downloaded LaTeX packages
      - name: Cache Tectonic packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/Tectonic
          key: ${{ runner.os }}-tectonic-0.17.0-${{ hashFiles('resume.tex') }}
          restore-keys: |
            ${{ runner.os }}-tectonic-0.17.0-

      - name: Set up Tectonic
        uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: 0.17.0

      # Step 6: Compile the cleaned source into resume.pdf
      - name: Compile resume
        run: tectonic resume.tex

      # Step 7: Export PDF and 300 DPI PNG
      - name: Export PDF and PNG
        run: |
          python - <<'PY'
          import fitz

          doc = fitz.open("resume.pdf")
          doc.save("dist/images/resume.pdf", garbage=4, deflate=True)
          doc[0].get_pixmap(dpi=300).save("dist/images/resume.png")
          PY
          rm -f resume.tex resume.pdf
          rm -rf temp

      # Step 8: Commit and push changes back to github (ignore PDF due metadata: ie date)
      - name: Push resume to github
        run: |
          # Use official GitHub Actions bot identity for automated commits
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add dist/images/resume.png

          if ! git diff --cached --quiet -- dist/images/resume.png; then
            # If PNG changed, commit both PDF and PNG
            git add dist/images/resume.pdf
            git commit -m "updated resume (both PDF & PNG) from Overleaf"
            git push
          fi
