# Workflow Name displayed in the GitHub Actions tab
name: Sync Resume from Overleaf

on:
  # Manual trigger: runs in "Actions" tab > "Run workflow" button
  workflow_dispatch:
  push:
    branches:
      - redesign

jobs:
  sync-resume:
    # Settings of the Github container
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Step 1: Assess the github repo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Python for document processing
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install dependencies and download PDF from url (repo variable)
      - name: Download resume from Overleaf
        env:
          OVERLEAF_URL: ${{ vars.OVERLEAF_RESUME_URL }}
        run: |
          [ -n "$OVERLEAF_URL" ] || { echo "OVERLEAF_READ_URL variable is empty or missing"; exit 1; }
          git clone --depth 1 --branch v2 https://github.com/Sbrjt/overleaf-resume-syncer /tmp/syncer
          pip install -q -r /tmp/syncer/requirements.txt pymupdf
          python /tmp/syncer/download_from_overleaf.py "$OVERLEAF_URL"
          test -f resume.pdf || { echo "resume.pdf was not downloaded"; exit 1; }

      # Step 4: Execute inline Python script to sanitize private details and export PNG
      - name: Redact Phone & Generate PDF and PNG
        run: |
          python - << 'EOF'
          import fitz, sys

          doc = fitz.open("resume.pdf")
          page = doc[0]

          hits = 0
          # Find any clickable link starting with "tel:"
          for link in page.get_links():
              if link.get("uri", "").startswith("tel:"):
                  rect = link["from"]
                  rect.x0 -= 25  # Extend box 25pt left to also erase "\quad|\quad"
                  page.add_redact_annot(rect, fill=(1, 1, 1))
                  page.delete_link(link)  # Remove the clickable hyperlink itself
                  hits += 1

          # Stop before publishing anything if no phone link was found
          if hits == 0:
              sys.exit("ERROR: no tel: link found, nothing was redacted")

          # Permanently erase the underlying text inside the box
          page.apply_redactions()

          # Save cleaned PDF and 300 DPI PNG
          doc.save("dist/images/resume.pdf", garbage=4, deflate=True)
          page.get_pixmap(dpi=300).save("dist/images/resume.png")
          EOF
          rm -rf resume.pdf resume.tex temp

      # Step 5: Commit and push changes back to github
      - name: Push resume to github
        run: |
          # Use official GitHub Actions bot identity for automated commits
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist/images/resume.pdf dist/images/resume.png
          git commit -m "updated resume (both PDF & PNG) from Overleaf" || exit 0
          git push
