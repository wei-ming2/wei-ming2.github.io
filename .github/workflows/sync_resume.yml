# Workflow Name displayed in the GitHub Actions tab
name: Sync Resume from Overleaf

on:
  # Manual trigger: runs in "Actions" tab > "Run workflow" button
  workflow_dispatch:
  push:
    branches:
      - redesign

jobs:
  sync-resume:
    # Settings of the Github container
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Step 1: Assess the github repo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Read resume from Overleaf > `output.pdf`
      - name: Read resume from Overleaf
        env:
          OVERLEAF_EMAIL: ${{ secrets.OVERLEAF_EMAIL }}
          OVERLEAF_PASSWORD: ${{ secrets.OVERLEAF_PASSWORD }}
          OVERLEAF_RESUME_ID: ${{ secrets.OVERLEAF_RESUME_ID }}
        run: |
          npm install -g @aloth/olcli
          olcli pdf "$OVERLEAF_RESUME_ID" -o output.pdf

      # Step 3: Set up Python runtime for document processing
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 4: Install PyMuPDF (fitz), which handles PDF redaction and high-res image rendering
      - name: Install Redaction & Rendering Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf

      # Step 5: Execute inline Python script to sanitize private details and export PNG
      - name: Redact Phone & Generate PDF and PNG
        run: |
          pip install pymupdf
          python - << 'EOF'
          import fitz

          doc = fitz.open("output.pdf")
          page = doc[0]

          # Find any clickable link starting with "tel:"
          for link in page.get_links():
              if link.get("uri", "").startswith("tel:"):
                  rect = link["from"]
                  rect.x0 -= 25  # Extend box 25pt left to also erase "\quad|\quad"
                  page.add_redact_annot(rect, fill=(1, 1, 1))
                  page.delete_link(link)  # Remove the clickable hyperlink itself

          # Permanently erase the underlying text inside the box
          page.apply_redactions()

          # Save cleaned PDF and 300 DPI PNG
          doc.save("images/resume.pdf", garbage=4, deflate=True)
          page.get_pixmap(dpi=300).save("images/resume.png")
          EOF
          rm output.pdf

      # Step 6: Commit and push changes back to github
      - name: Push resume to github
        run: |
          # Use official GitHub Actions bot identity for automated commits
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add images/resume.pdf images/resume.png
          git commit -m "updated resume (both PDF & PNG) from Overleaf" || exit 0
          git push
